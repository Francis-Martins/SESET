<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attendance Search — Attendance System</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Source+Sans+Pro:wght@400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="app-shell">

    <!-- Mobile top bar -->
    <div class="mobile-topbar">
      <button class="hamburger-btn" id="hamburgerBtn" aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>
      <span>Attendance System</span>
      <span style="width:24px;"></span>
    </div>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-brand"></div>
      <div class="sidebar-nav">
        <a href="courses.html">
           Courses & Lectures
        </a>
        <a href="students.html">
           Students
        </a>
        <a href="attendance-search.html" class="active">
           Attendance Search
        </a>
        <a href="reports.html">
           Reports & Analysis
        </a>
      </div>
      <div class="sidebar-logout">
        <a href="index.html">
           Logout
        </a>
      </div>
    </nav>

    <!-- Main content -->
    <main class="main-content">
      <div class="page-header">
        <h1>Attendance Search</h1>
        <p class="subtext">Search attendance records by student, course, or both.</p>
      </div>

      <!-- Filter Bar -->
      <div class="card" style="margin-bottom: 24px;">
        <form id="searchForm">
          <div class="form-row">
            <div class="form-group">
              <label for="studentInput">Student (name or reg no)</label>
              <input type="text" id="studentInput" placeholder="e.g. Amara Chukwu or STU1001" />
            </div>
            <div class="form-group">
              <label for="courseSelect">Course</label>
              <select id="courseSelect">
                <option value="">-- Any Course --</option>
                <!-- Populated by JS -->
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="dateFrom">Date From</label>
              <input type="date" id="dateFrom" />
            </div>
            <div class="form-group">
              <label for="dateTo">Date To</label>
              <input type="date" id="dateTo" />
            </div>
          </div>
          <button type="submit" class="btn btn-primary">Search</button>
        </form>
      </div>

      <!-- Results Area -->
      <section>
        <div class="results-toolbar">
          <h2 style="font-size:1.1rem;">Results</h2>
          <button class="btn btn-secondary no-print" id="printResultsBtn" style="display:none;">Print</button>
        </div>

        <div id="resultsArea">
          <p style="color:#999;">Enter a student and/or course above, then click Search.</p>
        </div>
      </section>

    </main>
  </div>

  <script type="module" src="js/common.js"></script>
  <script type="module" src="js/attendance-search.js"></script>
</body>
</html>
