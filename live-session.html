<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Session — Attendance System</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Source+Sans+Pro:wght@400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="app-shell">

    <!-- Mobile top bar -->
    <div class="mobile-topbar">
      <button class="hamburger-btn" id="hamburgerBtn" aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>
      <span>Attendance System</span>
      <span style="width:24px;"></span>
    </div>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

   <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-brand"></div>
      <div class="sidebar-nav">
        <a href="courses.html" class = "active">
          Courses & Lectures
        </a>
        <a href="students.html">
           Students
        </a>
        <a href="attendance-search.html">
          Attendance Search
        </a>
        <a href="reports.html" >
           Reports & Analysis
        </a>
      </div>
      <div class="sidebar-logout">
        <a href="index.html">
           Logout
        </a>
      </div>
    </nav>

    <!-- Main content -->
    <main class="main-content">

      <div class="session-header">
        <div>
          <h1 id="lectureTitleDisplay">Lecture Title — Course Code</h1>
          <p class="session-meta" id="sessionDateDisplay">Date</p>
        </div>
        <div class="session-meta" id="timeRemainingDisplay">
          Time remaining: --:--
        </div>
      </div>

      <div class="session-status-row">
        <span class="badge badge-online" id="deviceStatusBadge">Device Online</span>
        <div class="stat-card">
          <span class="stat-value" id="checkedInCount">0</span>
          <span class="stat-label">students checked in</span>
        </div>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Time</th>
              <th>Name</th>
              <th>Reg No</th>
              <th>Mode</th>
            </tr>
          </thead>
          <tbody id="liveAttendanceBody">
            <!-- Populated by JS, new rows added in real time -->
          </tbody>
        </table>
      </div>

      <div class="session-actions">
        <button class="btn btn-secondary" id="printBtn">Print / Export</button>
        <button class="btn btn-primary" id="endSessionBtn">End Session</button>
      </div>

    </main>
  </div>

  <script type="module" src="js/common.js"></script>
  <script type="module" src="js/live-session.js"></script>
</body>
</html>
