<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — School Attendance System</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Source+Sans+Pro:wght@400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-brand">
        <h1></h1>
        <p>Attendance Management System</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Enter your username" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" required />
        </div>
          <p id="loginError" class="alert alert-warning" style="display:none;"></p>

        <button type="submit" class="btn btn-primary">Login</button>
      </form>
    </div>
  </div>

  <script type="module" src="js/login.js"></script>
  <script src="js/login.js"></script>
  <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { 
    getAuth, 
    signInWithEmailAndPassword 
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  // Paste your config object here
  const firebaseConfig = {
    apiKey: "AIzaSyCk3Qt5UbIn4YpNP7gitLGG0W4lOH5P3so",
    authDomain: "ele-tech.firebaseapp.com",
    projectId: "ele-tech",
    storageBucket: "ele-tech.firebasestorage.app",
    messagingSenderId: "859089167137",
    appId: "1:859089167137:web:dc9e0c8a4a14e24bb05460"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const loginForm = document.getElementById("loginForm");
  const errorMsg = document.getElementById("errorMsg");

  loginForm.addEventListener("submit", (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    signInWithEmailAndPassword(auth, email, password)
      .then((userCredential) => {
        // Login successful
        window.location.href = "courses-lectures.html";
      })
      .catch((error) => {
        errorMsg.textContent = "Invalid email or password.";
        errorMsg.style.display = "block";
      });
  });
</script>
</body>
</html>
