<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — School Attendance System</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Source+Sans+Pro:wght@400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/style.css"/>
</head>
<body>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-brand">
        <h1></h1>
        <p>Attendance Management System</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Enter your username" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" required />
        </div>
          <p id="loginError" class="alert alert-warning" style="display:none;"></p>

        <button type="submit" class="btn btn-primary">Login</button>
      </form>
    </div>
  </div>

  <script type="module" src="src/pages/login.js"></script>
</body>
</html>
