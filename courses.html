<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Courses & Lectures — Attendance System</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Source+Sans+Pro:wght@400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="app-shell">

    <!-- Mobile top bar -->
    <div class="mobile-topbar">
      <button class="hamburger-btn" id="hamburgerBtn" aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>
      <span>Attendance System</span>
      <span style="width:24px;"></span>
    </div>

    <!-- Sidebar overlay (mobile) -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-brand"></div>
      <div class="sidebar-nav">
        <a href="courses.html" class="active">
           Courses & Lectures
        </a>
        <a href="students.html">
           Students
        </a>
        <a href="attendance-search.html">
           Attendance Search
        </a>
        <a href="reports.html">
           Reports & Analysis
        </a>
      </div>
      <div class="sidebar-logout">
        <a href="index.html">
           Logout
        </a>
      </div>
    </nav>

    <!-- Main content -->
    <main class="main-content">
      <div class="page-header">
        <h1>Courses & Lectures</h1>
        <p class="subtext">Manage courses and start new lecture sessions.</p>
      </div>

      <!-- Section 1: Create New Course -->
      <section class="panel-section">
        <h2>Create New Course</h2>
        <div class="card">
          <form id="createCourseForm" class="form-inline">
            <div class="form-group">
              <label for="courseTitle">Course Title</label>
              <input type="text" id="courseTitle" placeholder="e.g. Introduction to Biology" required />
            </div>
            <button type="submit" class="btn btn-primary">Add Course</button>
          </form>
        </div>

        <div class="table-wrapper" style="margin-top: 20px;">
          <table>
            <thead>
              <tr>
                <th>Course Title</th>
                <th>Course Code</th>
                <th>Date Added</th>
              </tr>
            </thead>
            <tbody id="coursesTableBody">
              <!-- Populated by JS -->
            </tbody>
          </table>
        </div>
      </section>

      <!-- Section 2: Start New Lecture Session -->
      <section class="panel-section">
        <h2>Start New Lecture Session</h2>
        <div class="card">
          <form id="startSessionForm">
            <div class="form-row">
              <div class="form-group">
                <label for="sessionCourse">Course</label>
                <select id="sessionCourse" required>
                  <!-- Populated by JS -->
                </select>
              </div>
              <div class="form-group">
                <label for="lectureTitle">Lecture Title</label>
                <input type="text" id="lectureTitle" placeholder="e.g. Cell Structure" required />
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="lectureDate">Date</label>
                <input type="date" id="lectureDate" required />
              </div>
              <div class="form-group">
                <label for="startTime">Start Time</label>
                <input type="time" id="startTime" required />
              </div>
              <div class="form-group">
                <label for="endTime">End Time</label>
                <input type="time" id="endTime" required />
              </div>
            </div>
            <button type="submit" class="btn btn-primary">Start Session</button>
          </form>
        </div>
      </section>

      <!-- Section 3: Lecture History -->
      <section class="panel-section">
        <h2>Lecture History</h2>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Course</th>
                <th>Lecture Title</th>
                <th>Date</th>
                <th>Time</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="lectureHistoryBody">
              <!-- Populated by JS -->
            </tbody>
          </table>
        </div>
      </section>

    </main>
  </div>

<script type="module" src="js/common.js"></script>
<script type="module" src="js/courses.js"></script>
</body>
</html>
