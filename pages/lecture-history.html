   <!-- Sidebar -->

    <!-- Main content -->

      <!-- Section 3: Lecture History -->
<div class="page-header">
  <h1>Lecture History</h1>
  <p class="subtext">View past and active lecture sessions.</p>
</div>

<section class="panel-section">
  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>
            Course Code
            <select id="courseCodeFilter" class="header-dropdown">
              <option value="">All</option>
            </select>
          </th>
          <th>Lecture Title</th>
          <th>Date</th>
          <th>Time</th>
          <th>Open</th>
        </tr>
      </thead>
      <tbody id="lectureHistoryBody">
        <!-- Populated by JS -->
      </tbody>
    </table>
  </div>
</section>

<!-- Attendance sheet — hidden until "Open" is clicked -->
<section class="panel-section" id="attendanceSheetSection" style="display: none;">
  <div class="attendance-sheet" id="attendanceSheet">
    <div class="sheet-header">
      <h2 id="sheetCourseCode"></h2>
      <h3 id="sheetLectureTitle"></h3>
      <p id="sheetDate"></p>
    </div>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Reg No</th>
            <th>Time</th>
            <th>Mode</th>
          </tr>
        </thead>
        <tbody id="attendanceSheetBody">
          <!-- Populated by JS -->
        </tbody>
      </table>
    </div>
  </div>

  <button id="printAttendanceBtn" class="btn btn-primary" style="margin-top: 16px;">Print</button>
</section>

    </main>
  </div>

<script type="module" src="../src/shared/layout.js"></script>
