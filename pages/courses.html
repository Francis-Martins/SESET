   <!-- Sidebar -->

      </div>

      <!-- Section 1: Create New Course -->
      <section class="panel-section">        

        <div class="table-wrapper" style="margin-top: 20px;">
          <table>
            <thead>
              <tr>
                <th>Course Title</th>
                <th>Course Code</th>
                <th>Date Added</th>
              </tr>
            </thead>
            <tbody id="coursesTableBody">
              <!-- Populated by JS -->
            </tbody>
          </table>
        </div>

      <h2 style="margin-top: 40px;">Create New Course</h2>
<div class="card">
  <form id="createCourseForm" class="form-inline">
    <div class="form-group">
      <label for="courseTitle">Course Title</label>
      <input type="text" id="courseTitle" placeholder="e.g. Industrial Electronics Design" required />
    </div>
    <div class="form-group">
      <label for="courseCode">Course Code</label>
      <input type="text" id="courseCode" placeholder="e.g. ELE201" required />
    </div>
    <button type="submit" class="btn btn-primary">Add Course</button>
  </form>
</div>
      </section>

      

    </main>
