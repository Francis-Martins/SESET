<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Courses & Lectures — Attendance System</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Source+Sans+Pro:wght@400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="app-shell">

    <!-- Mobile top bar -->
    <div class="mobile-topbar">
      <button class="hamburger-btn" id="hamburgerBtn" aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>
      <span>Create Session</span>
      <span style="width:24px;"></span>
    </div>

    <!-- Sidebar overlay (mobile) -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

   <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-brand"></div>
      <div class="sidebar-nav">
         <a href="live-session.html">
           Live Session
        </a>
        <a href="courses.html">
           Courses
        </a>
        <a href="students.html">
           Students
        </a>

        <a href="create-session.html" class="active">
        Create Session
        </a>
        <a href="lecture-history.html">
           Lecture History
        </a>
       
         <a href="enrollment.html">
           Enroll
        </a>
        <a href="reports.html">
           Reports & Analysis
        </a>
       
      </div>
      <div class="sidebar-logout">
        <a href="index.html">
           Logout
        </a>
      </div>
    </nav>

    <!-- Main content -->
    <main class="main-content">
      


      <!-- Section 2: Start New Lecture Session -->
      <section class="panel-section">
        <h1>Start New Lecture Session</h1>
        <div class="card">
          <form id="startSessionForm">
            <div class="form-row">
              <div class="form-group">
                <label for="sessionCourse">Course</label>
                <select id="sessionCourse" required>
                  <!-- Populated by JS -->
                </select>
              </div>
              <div class="form-group">
                <label for="lectureTitle">Lecture Title</label>
                <input type="text" id="lectureTitle" placeholder="e.g. Cell Structure" required />
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="lectureDate">Date</label>
                <input type="date" id="lectureDate" required />
              </div>
              <div class="form-group">
                <label for="startTime">Start Time</label>
                <input type="time" id="startTime" required />
              </div>
              <div class="form-group">
                <label for="endTime">End Time</label>
                <input type="time" id="endTime" required />
              </div>
            </div>
            <button type="submit" class="btn btn-primary">Start Session</button>
          </form>
        </div>
      </section>

      

    </main>
  </div>

<script type="module" src="js/common.js"></script>
<script type="module" src="js/create-session.js"></script>

</body>
</html>
