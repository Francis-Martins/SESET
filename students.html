  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="app-shell">

    <!-- Mobile top bar -->
    <div class="mobile-topbar">
      <button class="hamburger-btn" id="hamburgerBtn" aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>
      <span>Attendance System</span>
      <span style="width:24px;"></span>
    </div>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-brand"></div>
      <div class="sidebar-nav">
         <a href="live-session.html">
           Live Session
        </a>
        <a href="courses.html">
           Courses
        </a>
        <a href="students.html" class="active" >
           Students
        </a>

        <a href="create-session.html">
        Create Session
        </a>
        <a href="lecture-history.html">
           Lecture History
        </a>
       
         <a href="enrollment.html">
           Enroll
        </a>
        <a href="reports.html">

        </a>
       
      </div>
      <div class="sidebar-logout">
        <a href="index.html">
           Logout
        </a>
      </div>
    </nav>

    <!-- Main content -->
    <main class="main-content">
      <div class="page-header" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px;">
        <div>
          <h1>Students</h1>
          <p class="subtext">Manage enrolled students and their biometric registrations.</p>
        </div>
        <a href="enrollment.html" class="btn btn-primary">Add Student</a>
      </div>

      <div class="form-group" style="max-width: 320px; margin-bottom: 20px;">
        <label for="studentSearch">Search Students</label>
        <input type="text" id="studentSearch" placeholder="Search by name or reg no..." />
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Reg No</th>
              <th>Fingerprint</th>
              <th>RFID</th>
            </tr>
          </thead>
          <tbody id="studentsTableBody">
            <!-- Populated by JS -->
          </tbody>
        </table>
      </div>

    </main>
  </div>

 <script type="module" src="js/common.js"></script>
 <script type="module" src="js/students.js"></script>
